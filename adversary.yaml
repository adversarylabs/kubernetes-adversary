name: kubernetes
version: 0.0.0
description: Reviews Kubernetes manifests for workload isolation, image integrity, and host access.

triggers:
  manual: true
  files_changed:
    - "**/*.yml"
    - "**/*.yaml"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write:
      - .adversary/results
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
