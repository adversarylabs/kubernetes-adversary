name: kubernetes
version: 0.0.1
description: Reviews Kubernetes manifests for workload isolation, image integrity, and host access.

triggers:
  manual: true
  files_changed:
    - "**/*.yml"
    - "**/*.yaml"

detection:
  files:
    - "k8s/**/*.yml"
    - "k8s/**/*.yaml"
    - "kubernetes/**/*.yml"
    - "kubernetes/**/*.yaml"
    - "manifests/**/*.yml"
    - "manifests/**/*.yaml"
    - "**/*deployment*.yml"
    - "**/*deployment*.yaml"
    - "**/*service*.yml"
    - "**/*service*.yaml"
    - "**/*ingress*.yml"
    - "**/*ingress*.yaml"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write:
      - .adversary/results
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
