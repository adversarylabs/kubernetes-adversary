apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
spec:
  template:
    spec:
      containers:
        - name: agent
          image: example.com/node-agent:v1.2.3
          securityContext:
            privileged: false
            runAsUser: 0
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - SYS_ADMIN
        - name: web
          image: example.com/web:v1.2.3
          securityContext:
            privileged: false
            runAsNonRoot: true
            capabilities:
              add:
                - NET_BIND_SERVICE
        - name: explicitly-privileged-agent
          image: example.com/node-agent:v1.2.3
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
