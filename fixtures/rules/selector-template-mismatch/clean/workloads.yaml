apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        version: v2
    spec:
      containers:
        - name: api
          image: example/api:v1.2.3
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
spec:
  selector:
    matchExpressions:
      - key: component
        operator: In
        values: [agent]
  template:
    metadata:
      labels:
        component: agent
    spec:
      containers:
        - name: agent
          image: example/agent:v4.5.6
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
